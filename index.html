<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ポイ活">
  <title>ポイ活ランチャー</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow" id="today-date">今日</p>
      <div class="hero-row">
        <div>
          <h1>ポイ活</h1>
          <p class="summary"><strong id="remaining-count">0</strong> 件残り</p>
        </div>
        <span class="device-note">この端末だけに保存</span>
      </div>
    </header>

    <section class="next-action" aria-label="次のポイ活">
      <button id="next-button" class="primary-button" type="button">次を開く</button>
      <p id="next-name" class="next-name">読み込み中…</p>
    </section>

    <section class="section-block">
      <div class="section-heading">
        <h2>今日やること</h2>
        <span id="done-count" class="muted"></span>
      </div>
      <div id="today-list" class="service-list" aria-live="polite"></div>
    </section>

    <details class="other-section">
      <summary>今日は対象外</summary>
      <div id="other-list" class="service-list compact"></div>
    </details>

    <footer>
      <p>「開く」を押すと、この端末では実施済みとして記録します。操作できなかった場合は「戻す」で解除できます。</p>
    </footer>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
